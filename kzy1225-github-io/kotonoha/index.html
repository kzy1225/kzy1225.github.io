<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><meta name="description" content="文字を数える。言葉を整える。シンプルな要約ノート。"><title>Kotonoha</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>Kotonoha<span>文字数ノート</span></h1><div class="controls"><label class="sr-only" for="target">目標文字数</label><select id="target"><option value="0">目標なし</option><option value="100">100文字</option><option value="200">200文字</option></select><button id="settings-toggle" aria-expanded="false" aria-controls="settings">設定</button></div></header>
<section id="settings" hidden><label for="mode">文字の数え方</label><select id="mode"><option value="normal">全角・半角ともに1文字</option><option value="weighted">全角1文字・半角0.5文字</option></select><p>改行は除外、空白は含みます。方眼は数え方にかかわらず1マス1文字です。</p></section>
<section class="editor" aria-label="文章の入力"><label class="sr-only" for="text">文章</label><textarea id="text" placeholder="ここから、書きはじめる。" spellcheck="false"></textarea><div class="status"><div class="metrics" role="status" aria-live="polite"><span><strong id="count">0</strong><span class="unit">文字</span></span><span id="remaining" hidden></span><span id="weighted" hidden>半角 0.5</span></div><button id="copy">コピー</button></div></section>
<section class="sheet" aria-label="文字位置の確認"><div id="grid" class="grid"></div><div class="sheet-footer"><span id="position" role="status">マスを選んで文字位置を確認</span><button id="more" hidden>続きを表示</button></div></section>
<footer><span id="saved">このブラウザに自動保存</span></footer>
</main><script type="module" src="app.mjs"></script></body></html>
