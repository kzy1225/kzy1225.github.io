<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<title>現金合計</title>

<style>

body{
    font-family: "IBM Plex Sans JP", sans-serif;
    margin:30px;
    background:#f5f5f5;
    font-size:20px;
}


table{
    border-collapse:collapse;
    background:white;
    width:100%;
    max-width:700px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#eee;
}

input{
    width:60px;
    padding:5px;
    text-align:center;

    font-family: inherit;

    font-size:24px;

}

button{
    margin-top:20px;
    padding:10px 25px;

    font-family: inherit;

    font-size:20px;

}

.spin-btn{
    margin-top:0;
    padding:4px 10px;
    font-size:22px;
    font-weight:bold;
    vertical-align:middle;
    cursor:pointer;
    line-height:1;
}

.amt-label{
    display:block;
    font-size:13px;
    color:#888;
    margin-top:3px;
}

#sumTable{
    max-width:none;
}

#sumTable th, #sumTable td{
    padding:5px;
}

#sumTable input{
    width:44px;
    padding:3px;
    font-size:17px;
}

#sumTable .spin-btn{
    padding:2px 6px;
    font-size:16px;
}

#sumTable .amt-label{
    font-size:10px;
}

.col-controls{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.col-controls button{
    margin-top:0;
    padding:6px 16px;
    font-size:18px;
}

#colCountLabel{
    font-size:18px;
    color:#555;
}

#sum_grand_total{
    text-align:right;
    font-size:24px;
    padding:12px 16px;
}

</style>

</head>

<body>

<h1>現金合計</h1>

<div class="col-controls">
<button onclick="removeColumn()">－ 列を減らす</button>
<span id="colCountLabel">4列</span>
<button onclick="addColumn()">＋ 列を増やす</button>
</div>

<table id="sumTable">
<thead>
</thead>
<tbody>
</tbody>
<tfoot>
</tfoot>
</table>

<script>

const denoms=[10000,5000,2000,1000,500,100,50,10,5,1];

let sumCols = 4;
const MIN_SUM_COLS = 1;
const MAX_SUM_COLS = 8;

function adj(id, delta) {
    const el = document.getElementById(id);
    const v = Number(el.value) + delta;
    el.value = v < 0 ? 0 : v;
    updateAmt(el);
    if (id.startsWith('sc')) handleSumInputChange(id);
}

function updateAmt(el) {
    const lbl = document.getElementById('lbl_' + el.id);
    if (!lbl) return;
    const denom = Number(el.id.match(/\d+$/)[0]);
    const count = Number(el.value) || 0;
    lbl.textContent = (count * denom).toLocaleString() + '円';
}

function renderSumTable() {

    const savedValues = {};
    document.querySelectorAll('#sumTable input').forEach(el => savedValues[el.id] = el.value);

    let theadHtml = '<tr><th>券種</th>';
    for (let c = 1; c <= sumCols; c++) theadHtml += `<th>現金枚数${c}</th>`;
    theadHtml += '<th>合計枚数</th><th>金額</th></tr>';

    let tbodyHtml = '';
    for (const d of denoms) {
        tbodyHtml += `<tr><td>${d.toLocaleString()}円</td>`;
        for (let c = 1; c <= sumCols; c++) {
            const id = `sc${c}_${d}`;
            tbodyHtml += `<td><button class="spin-btn" onclick="adj('${id}',-1)">－</button><input id="${id}" value=""><button class="spin-btn" onclick="adj('${id}',1)">＋</button></td>`;
        }
        tbodyHtml += `<td id="sum_total_${d}">－</td><td id="sum_amt_${d}">－</td></tr>`;
    }

    let tfootHtml = '<tr><th>列合計</th>';
    for (let c = 1; c <= sumCols; c++) tfootHtml += `<th id="col_total_${c}">－</th>`;
    tfootHtml += '<th id="sum_grand_count">－</th><th id="sum_grand_amt">－</th></tr>';
    tfootHtml += `<tr><th colspan="${sumCols + 3}" id="sum_grand_total">合計金額：－</th></tr>`;

    document.querySelector('#sumTable thead').innerHTML = theadHtml;
    document.querySelector('#sumTable tbody').innerHTML = tbodyHtml;
    document.querySelector('#sumTable tfoot').innerHTML = tfootHtml;

    document.querySelectorAll('#sumTable input').forEach(el => {
        if (savedValues[el.id] !== undefined) el.value = savedValues[el.id];

        const lbl = document.createElement('div');
        lbl.id = 'lbl_' + el.id;
        lbl.className = 'amt-label';
        el.parentNode.appendChild(lbl);

        el.addEventListener('input', () => {
            updateAmt(el);
            handleSumInputChange(el.id);
        });

        updateAmt(el);
    });

    const label = document.getElementById('colCountLabel');
    if (label) label.textContent = sumCols + '列';

    recomputeAllSums();
}

function handleSumInputChange(id) {
    const m = id.match(/^sc(\d+)_(\d+)$/);
    if (!m) return;
    updateSumRow(Number(m[2]));
    updateColumnTotal(Number(m[1]));
}

function updateSumRow(denom) {
    let total = 0;
    for (let c = 1; c <= sumCols; c++) {
        total += Number(document.getElementById(`sc${c}_${denom}`)?.value) || 0;
    }
    document.getElementById("sum_total_" + denom).textContent = total + "枚";
    document.getElementById("sum_amt_" + denom).textContent = (total * denom).toLocaleString() + "円";
    updateSumGrand();
}

function updateColumnTotal(col) {
    let amt = 0;
    for (const d of denoms) {
        amt += (Number(document.getElementById(`sc${col}_${d}`)?.value) || 0) * d;
    }
    const cell = document.getElementById('col_total_' + col);
    if (cell) cell.textContent = amt.toLocaleString() + "円";
}

function recomputeAllSums() {
    for (const d of denoms) updateSumRow(d);
    for (let c = 1; c <= sumCols; c++) updateColumnTotal(c);
}

function updateSumGrand() {
    let grandCount = 0;
    let grandTotal = 0;
    for (const d of denoms) {
        let total = 0;
        for (let c = 1; c <= sumCols; c++) {
            total += Number(document.getElementById(`sc${c}_${d}`)?.value) || 0;
        }
        grandCount += total;
        grandTotal += total * d;
    }
    document.getElementById("sum_grand_count").textContent = grandCount + "枚";
    document.getElementById("sum_grand_amt").textContent = grandTotal.toLocaleString() + "円";
    document.getElementById("sum_grand_total").textContent = "合計金額：" + grandTotal.toLocaleString() + "円";
}

function addColumn() {
    if (sumCols >= MAX_SUM_COLS) return;
    sumCols++;
    renderSumTable();
}

function removeColumn() {
    if (sumCols <= MIN_SUM_COLS) return;
    sumCols--;
    renderSumTable();
}

renderSumTable();

</script>

</body>
</html>
