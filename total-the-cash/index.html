<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
>

<title>現金合計</title>

<style>

body{
    font-family:"IBM Plex Sans JP",sans-serif;

    margin:30px;

    background:#f5f5f5;

    font-size:20px;
}


table{
    border-collapse:collapse;

    background:white;

    width:100%;

    max-width:700px;
}


th,
td{
    border:1px solid #ccc;

    padding:8px;

    text-align:center;
}


th{
    background:#eee;
}


input{
    width:60px;

    padding:5px;

    text-align:center;

    font-family:inherit;

    font-size:24px;

    cursor:pointer;
}


/* 選択中セル */

input.active-input{
    outline:3px solid #4285f4;

    background:#eef5ff;
}


button{
    margin-top:20px;

    padding:10px 25px;

    font-family:inherit;

    font-size:20px;

    cursor:pointer;
}


.amt-label{
    display:block;

    font-size:13px;

    color:#888;

    margin-top:3px;
}


#sumTable{
    max-width:none;
}


#sumTable th,
#sumTable td{
    padding:5px;
}


#sumTable input{
    width:52px;

    padding:4px;

    font-size:18px;
}


#sumTable .amt-label{
    font-size:10px;
}


.col-controls{
    display:flex;

    align-items:center;

    gap:10px;

    margin-bottom:10px;
}


.col-controls button{
    margin-top:0;

    padding:6px 16px;

    font-size:18px;
}


#colCountLabel{
    font-size:18px;

    color:#555;
}


#sum_grand_total{
    text-align:right;

    font-size:24px;

    padding:12px 16px;
}



/* ==============================
   ポップアップ型テンキー
   ============================== */

#keypad{

    position:fixed;

    display:none;

    z-index:1000;

    width:290px;

    box-sizing:border-box;

    padding:8px;

    background:#e7e7e7;

    border:1px solid #aaa;

    border-radius:10px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.25);

}


/* 入力内容表示 */

#keypadDisplay{

    height:34px;

    box-sizing:border-box;

    margin-bottom:6px;

    padding:3px 8px;

    background:white;

    border:1px solid #aaa;

    border-radius:5px;

    text-align:right;

    font-size:21px;

    line-height:26px;

    overflow:hidden;

    white-space:nowrap;
}


/* ± ボタン */

.adjust-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

    margin-bottom:5px;

}


.adjust-grid button{

    margin:0;

    padding:6px 2px;

    border:1px solid #aaa;

    border-radius:5px;

    background:white;

    font-size:16px;

}


/* 数字部分 */

.keypad-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:4px;

}


.keypad-grid button{

    margin:0;

    padding:7px 2px;

    min-height:40px;

    border:1px solid #aaa;

    border-radius:5px;

    background:white;

    font-size:20px;

    font-weight:500;

}


.keypad-grid button:active,
.adjust-grid button:active{

    background:#ccc;

}


.enter-btn{

    grid-column:span 4;

    background:#e8f0fe !important;

    font-weight:bold !important;

}


/* iPad横画面などで少し余裕を持たせる */

@media
(max-width:900px){

    body{
        margin:16px;
    }

}

</style>
</head>


<body>

<h1>現金合計</h1>


<div class="col-controls">

    <button onclick="removeColumn()">
        － 列を減らす
    </button>

    <span id="colCountLabel">
        4列
    </span>

    <button onclick="addColumn()">
        ＋ 列を増やす
    </button>

</div>


<table id="sumTable">

<thead>
</thead>

<tbody>
</tbody>

<tfoot>
</tfoot>

</table>



<!--
    普段は非表示。
    セルをタップした時だけ表示。
-->

<div id="keypad">

    <div id="keypadDisplay">
        0
    </div>


    <div class="adjust-grid">

        <button onclick="adjustActive(-10)">
            -10
        </button>

        <button onclick="adjustActive(-1)">
            -1
        </button>

        <button onclick="adjustActive(1)">
            +1
        </button>

        <button onclick="adjustActive(10)">
            +10
        </button>

    </div>


    <div class="keypad-grid">

        <button onclick="keyInput('7')">
            7
        </button>

        <button onclick="keyInput('8')">
            8
        </button>

        <button onclick="keyInput('9')">
            9
        </button>

        <button onclick="keyInput('/')">
            /
        </button>


        <button onclick="keyInput('4')">
            4
        </button>

        <button onclick="keyInput('5')">
            5
        </button>

        <button onclick="keyInput('6')">
            6
        </button>

        <button onclick="keyInput('*')">
            *
        </button>


        <button onclick="keyInput('1')">
            1
        </button>

        <button onclick="keyInput('2')">
            2
        </button>

        <button onclick="keyInput('3')">
            3
        </button>

        <button onclick="keyInput('-')">
            -
        </button>


        <button onclick="keyInput('0')">
            0
        </button>

        <button onclick="backspaceKey()">
            ⌫
        </button>

        <button onclick="clearKey()">
            C
        </button>

        <button onclick="keyInput('+')">
            +
        </button>


        <button
            class="enter-btn"
            onclick="enterKey()"
        >
            Enter
        </button>

    </div>

</div>



<script>

const denoms = [
    10000,
    5000,
    2000,
    1000,
    500,
    100,
    50,
    10,
    5,
    1
];


let sumCols = 4;


const MIN_SUM_COLS = 1;

const MAX_SUM_COLS = 8;



/* ==============================
   テンキー
   ============================== */

let activeInput = null;

let keypadBuffer = "";


/*
 * 入力欄選択
 */

function selectInput(el){

    if(
        activeInput &&
        activeInput !== el
    ){

        activeInput
            .classList
            .remove(
                "active-input"
            );

    }


    activeInput = el;


    activeInput
        .classList
        .add(
            "active-input"
        );


    keypadBuffer =
        el.value || "";


    updateKeypadDisplay();


    showKeypad(el);

}


/*
 * テンキー表示
 */

function showKeypad(el){

    const keypad =
        document.getElementById(
            "keypad"
        );


    keypad.style.display =
        "block";


    /*
     * いったん仮位置。
     * サイズ取得のため表示後に計算。
     */

    const rect =
        el.getBoundingClientRect();


    const keypadRect =
        keypad.getBoundingClientRect();


    const gap = 8;


    /*
     * 基本は入力欄の下
     */

    let top =
        rect.bottom + gap;


    /*
     * 画面下にはみ出すなら
     * 入力欄の上に表示
     */

    if(
        top +
        keypadRect.height >
        window.innerHeight - 8
    ){

        top =
            rect.top -
            keypadRect.height -
            gap;

    }


    /*
     * それでも上にはみ出す場合
     */

    if(top < 8){

        top = 8;

    }


    /*
     * 入力欄中央と
     * テンキー中央を合わせる
     */

    let left =
        rect.left +
        rect.width / 2 -
        keypadRect.width / 2;


    /*
     * 左右の画面外にはみ出さない
     */

    if(left < 8){

        left = 8;

    }


    if(
        left +
        keypadRect.width >
        window.innerWidth - 8
    ){

        left =
            window.innerWidth -
            keypadRect.width -
            8;

    }


    keypad.style.left =
        left + "px";


    keypad.style.top =
        top + "px";

}


/*
 * 閉じる
 */

function hideKeypad(){

    const keypad =
        document.getElementById(
            "keypad"
        );


    keypad.style.display =
        "none";


    if(activeInput){

        activeInput
            .classList
            .remove(
                "active-input"
            );

    }


    activeInput = null;

    keypadBuffer = "";

}


/*
 * 表示内容更新
 */

function updateKeypadDisplay(){

    const display =
        document.getElementById(
            "keypadDisplay"
        );


    display.textContent =
        keypadBuffer === ""
        ? "0"
        : keypadBuffer;

}


/*
 * 数字・演算子
 */

function keyInput(key){

    if(!activeInput){
        return;
    }


    const operators = [
        "+",
        "-",
        "*",
        "/"
    ];


    if(
        operators.includes(key)
    ){

        if(
            keypadBuffer === ""
        ){
            return;
        }


        const last =
            keypadBuffer.slice(-1);


        /*
         * 演算子を連続で押した場合、
         * 最後のものを置換。
         */

        if(
            operators.includes(last)
        ){

            keypadBuffer =
                keypadBuffer.slice(0,-1)
                +
                key;

        }
        else{

            keypadBuffer += key;

        }

    }
    else{

        keypadBuffer += key;

    }


    updateKeypadDisplay();

}


/*
 * 1文字削除
 */

function backspaceKey(){

    if(!activeInput){
        return;
    }


    keypadBuffer =
        keypadBuffer.slice(
            0,
            -1
        );


    updateKeypadDisplay();

}


/*
 * クリア
 */

function clearKey(){

    if(!activeInput){
        return;
    }


    keypadBuffer = "";


    updateKeypadDisplay();

}


/*
 * ±1 / ±10
 */

function adjustActive(delta){

    if(!activeInput){
        return;
    }


    let value =
        Number(
            activeInput.value
        ) || 0;


    value += delta;


    if(value < 0){

        value = 0;

    }


    setActiveValue(value);


    keypadBuffer =
        String(value);


    updateKeypadDisplay();

}


/*
 * Enter
 */

function enterKey(){

    if(!activeInput){
        return;
    }


    /*
     * 空欄なら0枚
     */

    if(
        keypadBuffer.trim()
        === ""
    ){

        setActiveValue(0);

        hideKeypad();

        return;

    }


    /*
     * 数字と四則演算記号のみ
     */

    if(
        !/^[0-9+\-*/]+$/
        .test(
            keypadBuffer
        )
    ){

        alert(
            "入力内容が不正です。"
        );

        return;

    }


    let result;


    try{

        result =
            Function(
                `"use strict";
                return (${keypadBuffer})`
            )();

    }
    catch(e){

        alert(
            "計算式が正しくありません。"
        );

        return;

    }


    /*
     * 枚数なので
     * 0以上の整数のみ
     */

    if(
        !Number.isFinite(result)
        ||
        result < 0
        ||
        !Number.isInteger(result)
    ){

        alert(
            "枚数は0以上の整数になるようにしてください。"
        );

        return;

    }


    setActiveValue(
        result
    );


    /*
     * Enterで閉じる
     */

    hideKeypad();

}


/*
 * 値反映
 */

function setActiveValue(value){

    if(!activeInput){
        return;
    }


    activeInput.value =
        value;


    updateAmt(
        activeInput
    );


    if(
        activeInput.id
            .startsWith(
                "sc"
            )
    ){

        handleSumInputChange(
            activeInput.id
        );

    }

}



/* ==============================
   テンキー外タップで閉じる
   ============================== */

document.addEventListener(
    "pointerdown",
    function(e){

        const keypad =
            document.getElementById(
                "keypad"
            );


        /*
         * テンキーを押した場合は
         * 閉じない
         */

        if(
            keypad.contains(
                e.target
            )
        ){
            return;
        }


        /*
         * 入力欄を押した場合も
         * selectInput側に任せる
         */

        if(
            e.target.matches(
                "#sumTable input"
            )
        ){
            return;
        }


        if(
            activeInput
        ){

            hideKeypad();

        }

    }
);



/* ==============================
   集計処理
   ============================== */

function updateAmt(el){

    const lbl =
        document.getElementById(
            "lbl_" + el.id
        );


    if(!lbl){
        return;
    }


    const denom =
        Number(
            el.id
                .match(
                    /\d+$/
                )[0]
        );


    const count =
        Number(
            el.value
        ) || 0;


    lbl.textContent =
        (
            count *
            denom
        )
        .toLocaleString()
        +
        "円";

}



function renderSumTable(){

    /*
     * 再描画する前に
     * テンキーを閉じる
     */

    hideKeypad();


    const savedValues = {};


    document
        .querySelectorAll(
            "#sumTable input"
        )
        .forEach(
            el => {

                savedValues[
                    el.id
                ] =
                    el.value;

            }
        );


    let theadHtml =
        "<tr><th>券種</th>";


    for(
        let c = 1;
        c <= sumCols;
        c++
    ){

        theadHtml +=
            `<th>現金枚数${c}</th>`;

    }


    theadHtml +=
        "<th>合計枚数</th>" +
        "<th>金額</th>" +
        "</tr>";



    let tbodyHtml = "";


    for(
        const d of denoms
    ){

        tbodyHtml +=
            `<tr>
                <td>
                    ${d.toLocaleString()}円
                </td>`;


        for(
            let c = 1;
            c <= sumCols;
            c++
        ){

            const id =
                `sc${c}_${d}`;


            tbodyHtml += `
                <td>

                    <input
                        id="${id}"
                        value=""
                        inputmode="none"
                        readonly
                    >

                </td>
            `;

        }


        tbodyHtml += `
            <td id="sum_total_${d}">
                －
            </td>

            <td id="sum_amt_${d}">
                －
            </td>

        </tr>`;

    }



    let tfootHtml =
        "<tr><th>列合計</th>";


    for(
        let c = 1;
        c <= sumCols;
        c++
    ){

        tfootHtml +=
            `<th id="col_total_${c}">
                －
            </th>`;

    }


    tfootHtml += `
        <th id="sum_grand_count">
            －
        </th>

        <th id="sum_grand_amt">
            －
        </th>

    </tr>`;


    tfootHtml += `
        <tr>

            <th
                colspan="${sumCols + 3}"
                id="sum_grand_total"
            >
                合計金額：－
            </th>

        </tr>
    `;



    document
        .querySelector(
            "#sumTable thead"
        )
        .innerHTML =
            theadHtml;


    document
        .querySelector(
            "#sumTable tbody"
        )
        .innerHTML =
            tbodyHtml;


    document
        .querySelector(
            "#sumTable tfoot"
        )
        .innerHTML =
            tfootHtml;



    document
        .querySelectorAll(
            "#sumTable input"
        )
        .forEach(
            el => {


                if(
                    savedValues[
                        el.id
                    ]
                    !== undefined
                ){

                    el.value =
                        savedValues[
                            el.id
                        ];

                }


                const lbl =
                    document
                        .createElement(
                            "div"
                        );


                lbl.id =
                    "lbl_" + el.id;


                lbl.className =
                    "amt-label";


                el.parentNode
                    .appendChild(
                        lbl
                    );


                /*
                 * iPadのタップ
                 */

                el.addEventListener(
                    "pointerdown",
                    function(e){

                        e.preventDefault();

                        selectInput(el);

                    }
                );


                updateAmt(el);

            }
        );


    const label =
        document.getElementById(
            "colCountLabel"
        );


    if(label){

        label.textContent =
            sumCols +
            "列";

    }


    recomputeAllSums();

}



function handleSumInputChange(id){

    const m =
        id.match(
            /^sc(\d+)_(\d+)$/
        );


    if(!m){
        return;
    }


    updateSumRow(
        Number(
            m[2]
        )
    );


    updateColumnTotal(
        Number(
            m[1]
        )
    );

}



function updateSumRow(denom){

    let total = 0;


    for(
        let c = 1;
        c <= sumCols;
        c++
    ){

        total +=
            Number(
                document
                    .getElementById(
                        `sc${c}_${denom}`
                    )
                    ?.value
            )
            ||
            0;

    }


    document
        .getElementById(
            "sum_total_" +
            denom
        )
        .textContent =
            total +
            "枚";


    document
        .getElementById(
            "sum_amt_" +
            denom
        )
        .textContent =
            (
                total *
                denom
            )
            .toLocaleString()
            +
            "円";


    updateSumGrand();

}



function updateColumnTotal(col){

    let amt = 0;


    for(
        const d of denoms
    ){

        amt +=
            (
                Number(
                    document
                        .getElementById(
                            `sc${col}_${d}`
                        )
                        ?.value
                )
                ||
                0
            )
            *
            d;

    }


    const cell =
        document.getElementById(
            "col_total_" +
            col
        );


    if(cell){

        cell.textContent =
            amt
            .toLocaleString()
            +
            "円";

    }

}



function recomputeAllSums(){

    for(
        const d of denoms
    ){

        updateSumRow(d);

    }


    for(
        let c = 1;
        c <= sumCols;
        c++
    ){

        updateColumnTotal(c);

    }

}



function updateSumGrand(){

    let grandCount = 0;

    let grandTotal = 0;


    for(
        const d of denoms
    ){

        let total = 0;


        for(
            let c = 1;
            c <= sumCols;
            c++
        ){

            total +=
                Number(
                    document
                        .getElementById(
                            `sc${c}_${d}`
                        )
                        ?.value
                )
                ||
                0;

        }


        grandCount +=
            total;


        grandTotal +=
            total *
            d;

    }


    document
        .getElementById(
            "sum_grand_count"
        )
        .textContent =
            grandCount +
            "枚";


    document
        .getElementById(
            "sum_grand_amt"
        )
        .textContent =
            grandTotal
            .toLocaleString()
            +
            "円";


    document
        .getElementById(
            "sum_grand_total"
        )
        .textContent =
            "合計金額：" +
            grandTotal
            .toLocaleString()
            +
            "円";

}



function addColumn(){

    if(
        sumCols >=
        MAX_SUM_COLS
    ){
        return;
    }


    sumCols++;


    renderSumTable();

}



function removeColumn(){

    if(
        sumCols <=
        MIN_SUM_COLS
    ){
        return;
    }


    sumCols--;


    renderSumTable();

}



renderSumTable();

</script>

</body>
</html>
